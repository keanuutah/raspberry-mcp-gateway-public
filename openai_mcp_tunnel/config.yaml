name: "Raspberry MCP Gateway"
slug: "openai_mcp_tunnel"
version: "1.1.2"
url: "https://github.com/keanuutah/raspberry-mcp-gateway-public"
description: "Sichere Verbindung zwischen ChatGPT und Home Assistant – mit MCP-Tunnel, geschützter YAML-Verwaltung und Dashboard-Funktionen."
arch:
  - aarch64
startup: application
boot: manual
init: false
stage: stable
apparmor: true
legacy: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant_config
options:
  CONTROL_PLANE_TUNNEL_ID: ""
  CONTROL_PLANE_API_KEY: ""
  MCP_SERVER_URL: "http://homeassistant.local:8123/api/mcp"
  HA_ACCESS_TOKEN: ""
  MCP_WRITE_ENABLED: false
  APPROVED_ACTION: ""
  BACKUP_RETENTION_MODE: "off"
schema:
  CONTROL_PLANE_TUNNEL_ID: str
  CONTROL_PLANE_API_KEY: password
  MCP_SERVER_URL: str
  HA_ACCESS_TOKEN: password
  MCP_WRITE_ENABLED: bool
  APPROVED_ACTION: str?
  BACKUP_RETENTION_MODE: list(off|preview)
